# «Что смотрим» на movies.burninghouse.ru, стандартный порт 443.
# Кладётся в /etc/nginx/sites-available/movies и линкуется в sites-enabled.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name movies.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/movies.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movies.burninghouse.ru/privkey.pem;

    # client_max_body_size оставлен дефолтным: сервис постеров с диска не
    # отдаёт (они грузятся прямо из CDN poiskkino.dev) и своих файлов
    # пользователь не загружает — в отличие от Trip с фото чеков.

    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name movies.burninghouse.ru;
    return 301 https://$host$request_uri;
}
