name: bh-movies

services:
  movies:
    image: shadowkick/movies:latest
    container_name: movies
    restart: unless-stopped
    labels:
      # Разрешаем Watchtower обновлять контейнер автоматически, когда в Docker Hub
      # появляется новый образ. Без метки он его не тронет: на сервере включён
      # режим строго opt-in (WATCHTOWER_LABEL_ENABLE=true), иначе он трогал бы и
      # чужие контейнеры. Установка — deploy/watchtower-compose.yml в репозитории Auth.
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      HOST: 0.0.0.0
      PORT: 8792
      # Общий auth-сервис. ОБЯЗАТЕЛЬНО и ровно тот адрес, что задан у auth в ISSUER:
      # он подписан внутрь токенов и сверяется побайтово. Без него сервис не стартует.
      AUTH_ISSUER: https://auth.burninghouse.ru
      AUTH_CLIENT_ID: movies
      # Общий секрет для Admin: доступ к /internal/stats и /internal/logs.
      # То же самое значение — в Auth, Финансах, Trip и в самом Admin.
      ADMIN_INTERNAL_KEY: замените-на-случайную-строку
      # Ключ poiskkino.dev. Берётся из файла .env рядом с этим compose (права 600)
      # и НИКОГДА не попадает ни в репозиторий, ни в образ: образ публичный, а
      # секрет внутри образа — секрет для всех.
      POISKKINO_API_KEY: ${POISKKINO_API_KEY:-}
      # Сервис должен быть зарегистрирован в auth как клиент (справочно, не выполнять
      # отсюда — это делается один раз руками на реальном сервере):
      #   docker compose exec auth node server.js client-add movies "Что смотрим?" https://movies.burninghouse.ru/
      # Фронт и API на одном домене, CORS не нужен.
    ports:
      # Только на localhost — наружу отдаёт nginx на 443 (см. README.md).
      - "127.0.0.1:8792:8792"
    volumes:
      - movies-data:/app/data

volumes:
  movies-data:
