name: Build and publish

# Пуш в main -> собираем образ и пушим в Docker Hub. На сервер этот workflow НЕ ходит:
# новый образ забирает Watchtower, который там крутится (установка — deploy/watchtower-compose.yml
# в репозитории Auth). Поэтому здесь нет SSH-ключа — нужен только токен Docker Hub,
# а он доступа к серверу не даёт.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'

# Не даём двум сборкам накладываться друг на друга, если запушили несколько коммитов подряд
concurrency:
  group: publish-movies
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: env
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: shadowkick/movies:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
