<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" role="img" aria-label="BurningHouse">
  <!-- Версия для 16-24 пикселей: контур пламени тот же, вырез дома крупнее и
       опущен ниже — иначе на фавиконе он затягивается и остаётся просто капля.
       Цвета вписаны напрямую (не через var) — «Что смотрим» / стронций-багрянец. -->
  <defs>
    <linearGradient id="bh-flame-small" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#ff3d5a"/>
    </linearGradient>
  </defs>
  <path fill="url(#bh-flame-small)" fill-rule="evenodd"
        d="M12 1.2C13.6 5 16.4 6.6 18.2 9.4C21.4 14.4 18.6 22.4 12 22.4C5.4 22.4 2.6 14.4 5.8 9.4C7.2 7.2 9.2 6 10.2 3.4C10.9 5.6 11.4 6.6 12 7.4C12.4 5.6 12.3 3.4 12 1.2ZM12 9.0 6.6 13.3V19.9H17.4V13.3Z"/>
</svg>
